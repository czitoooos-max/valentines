<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dla Weronisi ❤️</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff0f3; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        .container { background-color: white; padding: 40px 20px; border-radius: 30px; box-shadow: 0 10px 30px rgba(255, 77, 77, 0.2); width: 85%; max-width: 400px; z-index: 10; border: 2px solid #ffccd5; }
        h1 { color: #ff4d6d; font-size: 28px; }
        .buttons { margin-top: 20px; display: flex; justify-content: center; gap: 20px; min-height: 80px; }
        button { padding: 15px 35px; font-size: 20px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; }
        #yes { background: #ff4d6d; color: white; z-index: 20; }
        #no { background-color: #adb5bd; color: white; position: fixed; z-index: 100; transition: all 0.2s ease-out; }
        #message { display: none; }
        .my-img { width: 100%; border-radius: 20px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Styl latających serduszek */
        .heart {
            position: fixed;
            top: -10vh;
            font-size: 20px;
            color: #ff4d6d;
            user-select: none;
            z-index: 5;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh) translateX(20px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="question">Weronisia, czy zostaniesz moją Walentynką? ❤️</h1>
        <div class="buttons" id="button-group">
            <button id="yes" onclick="answerYes()">TAK!</button>
            <button id="no">NIE</button>
        </div>
        <div id="message">
            <h2>Wiedziałem Bąbelku! 😍❤️</h2>
           <img src="https://share.icloud.com/photos/09eTa7ISaXPgSAmjlXm829Ddg" alt="Dla Weroniki" class="my-img">
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('no');
        let heartInterval;

        function moveNo() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        const timer = setInterval(moveNo, 450);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveNo(); });

        // Funkcja tworząca pojedyncze serduszko
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        function answerYes() {
            clearInterval(timer);
            document.getElementById('message').style.display = 'block';
            document.getElementById('button-group').style.display = 'none';
            document.getElementById('question').style.display = 'none';
            btnNo.style.display = 'none';
            
            // Start deszczu serduszek
            heartInterval = setInterval(createHeart, 300);
        }
    </script>
</body>
</html>
